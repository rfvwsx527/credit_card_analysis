# Docker Swarm 部署方式：docker stack deploy -c streamlit.yml streamlit
# 需先建立 overlay 網路（若尚未建立）：docker network create -d overlay my_swarm_network
#
# 前置：先在本機建置映像（單節點 Swarm 直接用本機映像；多節點需推送 registry）
#   docker build -t credit-card-dashboard:1.0 .
# 並先幫節點加上 streamlit label，約束才有節點可落：
#   docker node update --label-add streamlit=true self   （self=目前節點；或在 Portainer 的 Node Labels 新增）
#
version: '3'  # compose 檔版本（3 以上支援 Swarm 部署）

services:

  streamlit_dashboard:  # 信用卡市場分析儀表板服務
    image: credit-card-dashboard:1.0  # 由本目錄 Dockerfile 建置的本機映像
    hostname: "streamlit_dashboard"
    environment:
      TZ: Asia/Taipei                   # 時區台北
      MYSQL_HOST: host.docker.internal  # 宿主機 MySQL；若 DB 也在 swarm 內請改成該服務名
      MYSQL_PORT: '3306'
      MYSQL_DB: mydb
      MYSQL_USER: root
      MYSQL_PASSWORD: 'ppWgnb_mfGe2m_'  # 教學用；正式環境建議改用 docker secret
      TBL_STATS: credit_card_stats_clean
      TBL_BANKS: banks_clean
      TBL_PTT: ptt_credit_card_clean
    ports:
      - 8501:8501  # 對外開放 Streamlit Web 介面（http://localhost:8501）
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 讓容器可連到宿主機（連宿主機 MySQL 用）
    networks:
      - my_swarm_network  # 加入 overlay 網路（與其他服務一致）
    deploy:
      mode: replicated
      replicas: 1
      placement:
        # 設定在 node label streamlit = true 的機器上執行
        constraints: [node.labels.streamlit==true]
      restart_policy:
        condition: on-failure  # 失敗時自動重啟

networks:
  my_swarm_network:
    external: true  # 使用外部已建立的 overlay 網路（需事先 docker network create）